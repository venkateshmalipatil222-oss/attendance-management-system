<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Mark Attendance</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .date-box {
            margin-bottom: 25px;
            text-align: center;
        }

        input[type="date"] {
            padding: 10px;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Mark Student Attendance</h1>

        <form method="POST">

            <div class="date-box">

                <label>
                    <strong>Attendance Date:</strong>
                </label>

                <input
                    type="date"
                    name="attendance_date"
                    required
                >

            </div>


            <table>

                <tr>

                    <th>ID</th>

                    <th>USN</th>

                    <th>Name</th>

                    <th>Department</th>

                    <th>Semester</th>

                    <th>Status</th>

                </tr>


                {% for student in students %}

                <tr>

                    <td>
                        {{ student.student_id }}
                    </td>

                    <td>
                        {{ student.usn }}
                    </td>

                    <td>
                        {{ student.name }}
                    </td>

                    <td>
                        {{ student.department }}
                    </td>

                    <td>
                        {{ student.semester }}
                    </td>

                    <td>

                        <select
                            name="status_{{ student.student_id }}"
                            required
                        >

                            <option value="Present">
                                Present
                            </option>

                            <option value="Absent">
                                Absent
                            </option>

                        </select>

                    </td>

                </tr>

                {% endfor %}

            </table>


            <button type="submit">
                Save Attendance
            </button>

        </form>


        <br>

        <a
            class="back"
            href="/admin/dashboard"
        >
            ⬅ Back to Dashboard
        </a>

    </div>

</body>

</html>
